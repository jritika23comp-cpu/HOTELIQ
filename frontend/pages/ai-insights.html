{% extends "base.html" %}
{% set title = "AI Insights Command" %}
{% set active = "ai-insights.html" %}
{% block content %}
<div id="page-root" class="text-xs text-slate-400">Loading insights...</div>
{% endblock %}
{% block scripts %}
<script>
(async function(){
  const root = document.getElementById('page-root');
  try {
    const d = await HotelIQ.api('/api/insights?market=' + encodeURIComponent(HotelIQ.market));
    const cards = (d.insights||[]).map(i => `
      <div class="bg-slate-900 border border-indigo-500/30 rounded-xl p-5">
        <span class="badge-tag badge-ai">AI GENERATED</span>
        <h3 class="font-bold text-white text-base mt-2">${i.title}</h3>
        <div class="mt-3 grid gap-2 text-xs">
          <p><span class="badge-tag badge-observed">OBSERVED</span> ${typeof i.observed==='string'?i.observed:JSON.stringify(i.observed)}</p>
          <p><span class="badge-tag badge-calculated">CALCULATED</span> ${typeof i.calculated==='string'?i.calculated:JSON.stringify(i.calculated)}</p>
          <p><span class="badge-tag badge-ai">AI</span> ${i.ai}</p>
        </div>
      </div>`).join('');
    root.innerHTML = HotelIQ.demoBanner(d) + `<div class="space-y-6"><div><h1 class="text-2xl font-bold text-white">AI Insights Command</h1><p class="text-xs text-slate-400">Narratives reference stored metrics only. They do not invent OTA facts.</p></div><div class="space-y-4">${cards}</div></div>`;
  } catch(e) { root.innerHTML = HotelIQ.stateBox('error','Unable to load insights. '+e.message); }
})();
</script>
{% endblock %}
