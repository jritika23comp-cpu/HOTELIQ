{% extends "base.html" %}
{% set title = "Alert Control Center" %}
{% set active = "alerts.html" %}
{% block content %}
<div id="page-root" class="text-xs text-slate-400">Loading alerts...</div>
{% endblock %}
{% block scripts %}
<script>
async function loadAlerts(){
  const root = document.getElementById('page-root');
  try {
    const d = await HotelIQ.api('/api/alerts');
    const items = (d.items||[]).map(a => {
      const col = a.severity==='high'||a.severity==='critical'?'red':'amber';
      return `<div class="p-4 bg-slate-900 border border-${col}-500/40 rounded-xl flex items-center justify-between text-xs gap-3">
        <div><div class="font-bold text-white">${a.alert_type} · ${a.property_name||'Market'}</div>
        <div class="text-slate-400 mt-0.5">${a.message}</div>
        <div class="text-slate-500 mt-1">${a.created_at} · ${a.status}</div></div>
        <div class="flex flex-col gap-2">
          <span class="px-2.5 py-1 bg-${col}-500/20 text-${col}-300 rounded font-bold text-[10px] uppercase">${a.severity}</span>
          ${a.status==='open'?`<button onclick="ack(${a.id})" class="px-2 py-1 bg-slate-800 rounded">Acknowledge</button>`:''}
        </div></div>`;
    }).join('');
    root.innerHTML = HotelIQ.demoBanner(d) + `<div class="space-y-6"><div><h1 class="text-2xl font-bold text-white">Alert Control Center</h1><p class="text-xs text-slate-400">Price, availability, market, and demand alerts from demo snapshots.</p></div><div class="space-y-3">${items||'<p class="text-slate-400">No alerts.</p>'}</div></div>`;
  } catch(e) { root.innerHTML = HotelIQ.stateBox('error','Unable to load alerts. '+e.message); }
}
async function ack(id){
  await HotelIQ.api('/api/alerts/'+id+'/status', {method:'POST', body: JSON.stringify({status:'acknowledged'})});
  loadAlerts();
}
loadAlerts();
</script>
{% endblock %}
