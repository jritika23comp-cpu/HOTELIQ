{% extends "base.html" %}
{% set title = "Tracked Portfolio" %}
{% set active = "properties.html" %}
{% block content %}
<div id="page-root" class="text-xs text-slate-400">Loading portfolio...</div>
{% endblock %}
{% block scripts %}
<script>
async function loadProps(){
  const root = document.getElementById('page-root');
  try {
    const d = await HotelIQ.api('/api/competitors?per_page=50&sort=name');
    const cards = (d.items||[]).filter(p=>p.is_portfolio || p.active).slice(0,40).map(p => `
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
        <div class="flex justify-between items-start">
          <div><h3 class="font-bold text-white">${p.name}</h3>
          <p class="text-xs text-slate-400">${p.location} · ${p.category}</p></div>
          <span class="px-2 py-0.5 rounded text-[10px] ${p.active?'bg-emerald-500/20 text-emerald-400':'bg-slate-700 text-slate-300'} font-bold">${p.active?'ACTIVE':'INACTIVE'}</span>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between text-xs text-slate-300">
          <span>${HotelIQ.inr(p.latest_price)} <span class="badge-tag badge-demo">DEMO</span></span>
          <span>
            <a class="text-cyan-400 mr-2" href="/competitor-detail.html?id=${p.id}">Open</a>
            <button class="text-amber-300 mr-2" onclick="toggleProp('${p.id}', ${p.active?0:1})">${p.active?'Disable':'Enable'}</button>
          </span>
        </div>
      </div>`).join('');
    root.innerHTML = HotelIQ.demoBanner(d) + `
    <div class="space-y-6">
      <div class="flex justify-between"><div><h1 class="text-2xl font-bold text-white">Tracked Portfolio Management</h1><p class="text-xs text-slate-400">Portfolio flags plus full competitor catalog.</p></div>
      <a href="/add-property.html" class="bg-cyan-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold">+ Onboard Property</a></div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${cards}</div>
    </div>`;
  } catch(e) { root.innerHTML = HotelIQ.stateBox('error','Unable to load properties. '+e.message); }
}
async function toggleProp(id, active){
  await HotelIQ.api('/api/competitors/'+id, {method:'PUT', body: JSON.stringify({active})});
  loadProps();
}
loadProps();
</script>
{% endblock %}
